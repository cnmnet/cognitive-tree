<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>认知晶体树 · 邀请码</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body,
        html {
            width: 100%;
            min-height: 100vh;
            background: #0b0a12;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }

        .container {
            max-width: 420px;
            width: 100%;
            position: relative;
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            background: #0b0a12;
        }

        /* 背景图完整显示 */
        .bg-image {
            width: 100%;
            height: auto;
            display: block;
        }

        /* ===== 交互层（浮在图片上，半透明毛玻璃） ===== */
        .overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px 24px 30px;
            /* 底部渐变遮罩，让控件更清晰 */
            background: linear-gradient(to top, rgba(0, 0, 0, 0.7) 0%, rgba(0, 0, 0, 0) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            pointer-events: none;
            /* 容器不拦截点击，子元素可点 */
        }

        .overlay>* {
            pointer-events: auto;
        }

        /* ===== 输入框 ===== */
        .input-group {
            width: 100%;
            max-width: 280px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 20px;
            font-size: 16px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.20);
            border-radius: 14px;
            color: #fff;
            text-align: center;
            letter-spacing: 3px;
            outline: none;
            transition: 0.3s;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            letter-spacing: 1px;
        }

        .input-group input:focus {
            border-color: rgba(212, 175, 55, 0.6);
            background: rgba(255, 255, 255, 0.16);
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.06);
        }

        /* ===== 金色按钮（质感参考第二张图） ===== */
        .btn-submit {
            width: 100%;
            max-width: 280px;
            padding: 14px 0;
            background: linear-gradient(135deg, #f6e05e 0%, #d4af37 50%, #b8942a 100%);
            border: none;
            border-radius: 14px;
            color: #0b0a12;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.25);
            position: relative;
            overflow: hidden;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .btn-submit:active {
            transform: scale(0.96);
        }

        /* 扫光动画 */
        .btn-submit::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -60%;
            width: 30%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
            transform: rotate(25deg);
            transition: 0.7s;
        }

        .btn-submit:hover::after {
            left: 120%;
        }

        /* ===== 底部小字 ===== */
        .footer-text {
            font-size: 11px;
            color: rgba(180, 170, 220, 0.2);
            letter-spacing: 2px;
            margin-top: 4px;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 420px) {
            .overlay {
                padding: 16px 16px 22px;
            }

            .input-group input {
                padding: 12px 16px;
                font-size: 14px;
            }

            .btn-submit {
                padding: 12px 0;
                font-size: 16px;
                letter-spacing: 3px;
            }
        }

        @media (max-width: 360px) {
            .input-group input {
                font-size: 13px;
                padding: 10px 14px;
            }

            .btn-submit {
                font-size: 14px;
                padding: 10px 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- 背景图（只有星空+标题+邀请码） -->
        <img class="bg-image" src="晶体树.png" alt="认知晶体树">

        <!-- 交互层 -->
        <div class="overlay">
            <div class="input-group">
                <input type="text" id="inviteInput" placeholder="请输入邀请码" maxlength="20" autofocus>
            </div>
            <button class="btn-submit" id="submitBtn">✦ 开启认知之旅 ✦</button>
            <div class="footer-text">认知晶体树 v2.2</div>
        </div>
    </div>

    <script>
        (function () {
            const input = document.getElementById('inviteInput');
            const btn = document.getElementById('submitBtn');

            input.addEventListener('input', function () {
                this.value = this.value.toUpperCase();
            });

            btn.addEventListener('click', function () {
                const code = input.value.trim();
                if (!code) {
                    input.style.borderColor = 'rgba(255,80,80,0.6)';
                    input.style.boxShadow = '0 0 30px rgba(255,80,80,0.08)';
                    setTimeout(() => {
                        input.style.borderColor = '';
                        input.style.boxShadow = '';
                    }, 1500);
                    return;
                }

                const isValid = code.toUpperCase() === 'CRYSTAL-25K';
                if (isValid) {
                    alert('🎉 邀请码验证成功！\n您已获得 2 次深度认知淬炼权限。');
                } else {
                    alert('❌ 邀请码无效，请重新输入。\n提示：CRYSTAL-25K');
                    input.value = '';
                    input.focus();
                }
            });

            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') btn.click();
            });

            input.addEventListener('focus', function () {
                this.style.borderColor = '';
                this.style.boxShadow = '';
            });
        })();
    </script>

</body>

</html>
